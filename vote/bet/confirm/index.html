<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover">
  <meta name="theme-color" content="#c89a32">
  <link rel="apple-touch-icon" sizes="180x180" href="/zenrace/apple-touch-icon.png?v=3">
  <link rel="icon" type="image/png" sizes="32x32" href="/zenrace/favicon-32x32.png?v=3">
  <link rel="icon" type="image/png" sizes="16x16" href="/zenrace/favicon-16x16.png?v=3">
  <link rel="shortcut icon" type="image/x-icon" href="/zenrace/favicon.ico?v=3">
  <title>投票内容確認 | ZENRACE</title>
  <link href="../../../shared/category-menu.css?v=60" rel="stylesheet">
  <link href="../../../shared/page-shell.css?v=20" rel="stylesheet">
  <link href="../../race-info.css?v=63" rel="stylesheet">
  <link href="../../../shared/race-button-style.css?v=6" rel="stylesheet">
  <link href="../bet.css?v=43" rel="stylesheet">
  <link href="confirm.css?v=22" rel="stylesheet">
  <script defer src="../../race-info.js?v=65"></script>
  <script defer src="../../live-state.js?v=1"></script>
  <script defer src="../../../shared/category-menu.js?v=57"></script>
  <script defer src="../../../shared/fixed-layout.js?v=23"></script>
  <script defer src="../../../shared/bottom-nav.js?v=64"></script>
  <script defer src="../../odds-data.js?v=1"></script>
  <script defer src="confirm.js?v=22"></script>
</head>
<body>
  <zenrace-category-menu active="bet" category="vote"></zenrace-category-menu>
  <div class="zenrace-content-shell confirm-gold-shell" data-zenrace-pinch-shell>
    <div class="zenrace-content-sizer" data-zenrace-pinch-sizer>
      <div class="zenrace-content-stage" data-zenrace-pinch-stage>
        <section class="delca-bar" aria-label="デルカ残高">
          <div class="delca-default" data-delca-default>
            <div class="delca-balance"><span>投票用デルカ</span><strong>123,456,789 <small>pt</small></strong></div>
            <div class="delca-actions">
              <button type="button"><span>デルカ</span><span>入金</span></button>
              <button type="button"><span>デルカ</span><span>に交換</span></button>
            </div>
          </div>
        </section>
        <zenrace-race-info race-filter-disabled></zenrace-race-info>

        <main class="confirm-page" aria-label="投票内容確認">
          <section class="confirm-summary" aria-label="投票合計と想定払戻金">
            <div class="summary-line"><span>投票合計</span><strong id="grand-total">0pt</strong></div>
            <div class="summary-line"><span>想定払戻金</span><strong id="grand-return">0円</strong></div>
            <div class="summary-line"><span>想定収支</span><strong id="grand-profit">0円</strong></div>
          </section>

          <div class="wager-groups" id="wager-groups" aria-live="polite"></div>
          <a class="confirm-back-link" href="../">投票入力に戻る</a>
        </main>
      </div>
    </div>
  </div>

  <button class="vote-submit-float" id="vote-submit" type="button">
    <span class="vote-submit-shine" aria-hidden="true"></span>
    <span>投票確定</span>
  </button>

  <div class="pin-approval-overlay" id="pin-approval-overlay" hidden>
    <section class="pin-approval-dialog" role="dialog" aria-modal="true" aria-labelledby="pin-approval-title">
      <button class="pin-approval-back" id="pin-approval-back" type="button" aria-label="暗証番号入力を閉じて投票確認へ戻る">×戻る</button>
      <h2 class="pin-approval-title" id="pin-approval-title">暗証番号を入力</h2>
      <div class="pin-approval-body">
        <label class="pin-approval-field">
          <span>暗証番号</span>
          <input id="pin-approval-input" type="password" inputmode="numeric" autocomplete="off" maxlength="8" pattern="[0-9]*">
        </label>
        <button class="pin-approval-submit" id="pin-approval-submit" type="button" disabled>承認して投票</button>
      </div>
    </section>
  </div>

  <zenrace-bottom-nav active="vote"></zenrace-bottom-nav>
</body>
</html>
