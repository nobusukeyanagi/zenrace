<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover">
  <meta name="theme-color" content="#c89a32">
  <link rel="apple-touch-icon" sizes="180x180" href="/zenrace/apple-touch-icon.png?v=3">
  <link rel="icon" type="image/png" sizes="32x32" href="/zenrace/favicon-32x32.png?v=3">
  <link rel="icon" type="image/png" sizes="16x16" href="/zenrace/favicon-16x16.png?v=3">
  <link rel="shortcut icon" type="image/x-icon" href="/zenrace/favicon.ico?v=3">
  <title>投票内容確認 | ZENRACE</title>
  <link href="../../../shared/category-menu.css?v=57" rel="stylesheet">
  <link href="../../../shared/page-shell.css?v=19" rel="stylesheet">
  <link href="../../race-info.css?v=59" rel="stylesheet">
  <link href="../../../shared/race-button-style.css?v=6" rel="stylesheet">
  <link href="../bet.css?v=15" rel="stylesheet">
  <link href="confirm.css?v=5" rel="stylesheet">
  <script defer src="../../race-info.js?v=60"></script>
  <script defer src="../../live-state.js?v=1"></script>
  <script defer src="../../../shared/category-menu.js?v=52"></script>
  <script defer src="../../../shared/fixed-layout.js?v=22"></script>
  <script defer src="../../../shared/bottom-nav.js?v=61"></script>
  <script defer src="../../odds-data.js?v=1"></script>
  <script defer src="confirm.js?v=5"></script>
</head>
<body>
  <zenrace-category-menu active="bet" category="vote"></zenrace-category-menu>
  <div class="zenrace-content-shell confirm-gold-shell" data-zenrace-pinch-shell>
    <div class="zenrace-content-sizer" data-zenrace-pinch-sizer>
      <div class="zenrace-content-stage" data-zenrace-pinch-stage>
        <section class="delca-bar" aria-label="デルカ残高">
          <div class="delca-balance"><span>投票用デルカ</span><strong>123,456,789 <small>pt</small></strong></div>
          <div class="delca-actions">
            <button type="button"><span>デルカ</span><span>入金</span></button>
            <button type="button"><span>デルカ</span><span>に交換</span></button>
          </div>
        </section>
        <zenrace-race-info></zenrace-race-info>

        <main class="confirm-page" aria-label="投票内容確認">
          <section class="confirm-summary" aria-label="投票総額と想定払戻">
            <div class="summary-line"><span>投票総額</span><strong id="grand-total">0pt</strong></div>
            <div class="summary-line"><span>想定払戻</span><strong id="grand-return">0円</strong></div>
            <div class="summary-line"><span>想定収支</span><strong id="grand-profit">0円</strong></div>
          </section>

          <div class="wager-groups" id="wager-groups" aria-live="polite"></div>
          <a class="confirm-back-link" href="../">買い目入力に戻る</a>
        </main>
      </div>
    </div>
  </div>

  <button class="vote-submit-float" id="vote-submit" type="button">
    <span class="vote-submit-shine" aria-hidden="true"></span>
    <span>投票確定</span>
  </button>
  <div class="confirm-toast" id="confirm-toast" role="status" aria-live="polite" hidden>投票内容を確定しました</div>
  <zenrace-bottom-nav active="vote"></zenrace-bottom-nav>
</body>
</html>
