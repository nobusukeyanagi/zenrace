<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover">
  <meta name="theme-color" content="#090909">
  <link rel="apple-touch-icon" sizes="180x180" href="/zenrace/apple-touch-icon.png?v=3">
  <link rel="icon" type="image/png" sizes="32x32" href="/zenrace/favicon-32x32.png?v=3">
  <link rel="icon" type="image/png" sizes="16x16" href="/zenrace/favicon-16x16.png?v=3">
  <link rel="shortcut icon" type="image/x-icon" href="/zenrace/favicon.ico?v=3">
  <title>買い目入力 | ZENRACE</title>
  <link href="../../shared/category-menu.css?v=57" rel="stylesheet">
  <link href="../../shared/page-shell.css?v=20" rel="stylesheet">
  <link href="../race-info.css?v=61" rel="stylesheet">
  <link href="../../shared/race-button-style.css?v=6" rel="stylesheet">
  <link href="bet.css?v=35" rel="stylesheet">
  <script defer src="../race-info.js?v=60"></script>
  <script defer src="../live-state.js?v=1"></script>
  <script defer src="../../shared/category-menu.js?v=53"></script>
  <script defer src="../../shared/fixed-layout.js?v=23"></script>
  <script defer src="../../shared/bottom-nav.js?v=61"></script>
  <script defer src="../odds-data.js?v=1"></script>
  <script defer src="bet.js?v=18"></script>
</head>
<body>
  <zenrace-category-menu active="bet" category="vote"></zenrace-category-menu>
  <div class="zenrace-content-shell" data-zenrace-pinch-shell>
    <div class="zenrace-content-sizer" data-zenrace-pinch-sizer>
      <div class="zenrace-content-stage" data-zenrace-pinch-stage>
        <section class="delca-bar" aria-label="デルカ残高・レース選択">
          <div class="delca-default" data-delca-default>
            <div class="delca-balance"><span>投票用デルカ</span><strong>123,456,789 <small>pt</small></strong></div>
            <div class="delca-actions">
              <button type="button"><span>デルカ</span><span>入金</span></button>
              <button type="button"><span>デルカ</span><span>に交換</span></button>
            </div>
          </div>
          <div class="bet-race-list" data-bet-race-list hidden aria-label="浜松のレース一覧"></div>
        </section>
        <zenrace-race-info></zenrace-race-info>

        <nav class="bet-type-menu" aria-label="賭式選択">
          <button class="bet-type-tab active" type="button" data-bet-type="3連単" aria-pressed="true">3連単</button>
          <button class="bet-type-tab" type="button" data-bet-type="3連複" aria-pressed="false">3連複</button>
          <button class="bet-type-tab" type="button" data-bet-type="2連単" aria-pressed="false">2連単</button>
          <button class="bet-type-tab" type="button" data-bet-type="2連複" aria-pressed="false">2連複</button>
          <button class="bet-type-tab" type="button" data-bet-type="ワイド" aria-pressed="false">ワイド</button>
          <button class="bet-type-tab" type="button" data-bet-type="単勝" aria-pressed="false">単勝</button>
        </nav>

        <main class="bet-page">
          <section class="bet-table-section" aria-label="買い目入力表">
            <div class="bet-table-scroll">
              <table class="bet-table">
                <colgroup>
                  <col class="col-car"><col class="col-rider">
                  <col class="col-pick"><col class="col-pick"><col class="col-pick"><col class="col-pick col-box">
                </colgroup>
                <thead><tr><th>車番</th><th>選手</th><th>1着</th><th>2着</th><th>3着</th><th class="box-divider">ボックス</th></tr></thead>
                <tbody id="bet-table-body"></tbody>
                <tfoot>
                  <tr>
                    <td colspan="2" class="bet-options-cell">
                      <label class="bet-option"><input id="multi-reverse-option" type="checkbox"><span>マルチ・裏目</span></label>
                    </td>
                    <td class="column-actions"><button data-column-all="first">全</button><button data-column-clear="first">消</button></td>
                    <td class="column-actions"><button data-column-all="second">全</button><button data-column-clear="second">消</button></td>
                    <td class="column-actions"><button data-column-all="third">全</button><button data-column-clear="third">消</button></td>
                    <td class="column-actions box-divider"><button data-column-all="box">全選</button><button data-column-clear="box">全消</button></td>
                  </tr>
                </tfoot>
              </table>
            </div>
          </section>

          <div class="selection-meta-row" aria-label="選択状況">
            <span>選択一覧</span><span id="selection-count">0点</span>
          </div>
          <section class="selection-section" aria-label="選択一覧">
            <div class="selection-list" id="selection-list">
              <div class="selection-empty">買い目を選択してください</div>
            </div>
          </section>
        </main>
      </div>
    </div>
  </div>
  <button class="bet-confirm-float" id="bet-confirm" type="button" hidden><span>選択内容</span><span>セット</span></button>
  <zenrace-bottom-nav active="vote"></zenrace-bottom-nav>
</body>
</html>
