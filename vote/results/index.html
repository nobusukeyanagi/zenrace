<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover">
  <meta name="theme-color" content="#090909">
  <link rel="apple-touch-icon" sizes="180x180" href="/zenrace/apple-touch-icon.png?v=3">
  <link rel="icon" type="image/png" sizes="32x32" href="/zenrace/favicon-32x32.png?v=3">
  <link rel="icon" type="image/png" sizes="16x16" href="/zenrace/favicon-16x16.png?v=3">
  <link rel="shortcut icon" type="image/x-icon" href="/zenrace/favicon.ico?v=3">
  <title>結果 | ZENRACE</title>
  <link href="../../shared/category-menu.css?v=57" rel="stylesheet">
  <link href="../../shared/page-shell.css?v=19" rel="stylesheet">
  <link href="../race-switch.css?v=66" rel="stylesheet">
  <link href="../race-info.css?v=59" rel="stylesheet">
  <link href="../../shared/race-button-style.css?v=6" rel="stylesheet">
  <link href="results.css?v=7" rel="stylesheet">
  <script defer src="../race-info.js?v=60"></script>
  <script defer src="../live-state.js?v=1"></script>
  <script defer src="../../shared/category-menu.js?v=53"></script>
  <script defer src="../../shared/fixed-layout.js?v=22"></script>
  <script defer src="../../shared/bottom-nav.js?v=61"></script>
  <script defer src="../race-switch.js?v=67"></script>
  <script defer src="results.js?v=2"></script>
</head>
<body>
  <zenrace-category-menu active="results" category="vote"></zenrace-category-menu>
  <div class="zenrace-content-shell" data-zenrace-pinch-shell>
    <div class="zenrace-content-sizer" data-zenrace-pinch-sizer>
      <div class="zenrace-content-stage" data-zenrace-pinch-stage>
        <zenrace-race-switch active-key="浜松-12R-16:45"></zenrace-race-switch>
        <zenrace-race-info></zenrace-race-info>

        <main class="vote-results-page">
          <section class="result-section" aria-labelledby="race-result-heading">
            <h1 class="result-section-heading" id="race-result-heading">レース結果</h1>
            <div class="result-card result-table-card">
              <table class="race-result-table" aria-label="レース結果">
                <colgroup>
                  <col class="finish-col">
                  <col class="car-col">
                  <col class="rider-col">
                  <col class="handicap-col">
                  <col class="trial-col">
                  <col class="race-time-col">
                  <col class="start-col">
                  <col class="incident-col">
                </colgroup>
                <thead>
                  <tr><th>着順</th><th>車番</th><th>選手</th><th>H</th><th>試走T</th><th>競走T</th><th>ST</th><th>異</th></tr>
                </thead>
                <tbody id="race-result-body"></tbody>
              </table>
            </div>
          </section>

          <section class="result-section" aria-labelledby="payout-heading">
            <h2 class="result-section-heading" id="payout-heading">払戻金</h2>
            <div class="result-card result-table-card">
              <table class="payout-table" aria-label="払戻金">
                <colgroup><col class="payout-type-col"><col class="payout-combination-col"><col class="payout-value-col"><col class="payout-popularity-col"></colgroup>
                <thead><tr><th>賭式</th><th>的中組番</th><th>払戻金</th><th>人気</th></tr></thead>
                <tbody id="payout-body"></tbody>
              </table>
            </div>
          </section>

          <section class="result-section grand-note-section" aria-labelledby="grand-note-heading">
            <h2 class="result-section-heading" id="grand-note-heading">グランドノート</h2>
            <div class="result-card grand-note-card">
              <div class="grand-note-scroll">
                <table class="grand-note-table" aria-label="グランドノート">
                  <thead id="grand-note-head"></thead>
                  <tbody id="grand-note-body"></tbody>
                </table>
              </div>
            </div>
          </section>
        </main>
      </div>
    </div>
  </div>
  <zenrace-bottom-nav active="vote"></zenrace-bottom-nav>
</body>
</html>
