<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover">
<meta name="theme-color" content="#090909">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<link rel="apple-touch-icon" sizes="180x180" href="/zenrace/apple-touch-icon.png?v=3">
<link rel="icon" type="image/png" sizes="32x32" href="/zenrace/favicon-32x32.png?v=3">
<link rel="icon" type="image/png" sizes="16x16" href="/zenrace/favicon-16x16.png?v=3">
<link rel="shortcut icon" type="image/x-icon" href="/zenrace/favicon.ico?v=3">
<title>開催日程 | ZENRACE</title>
<link rel="stylesheet" href="../shared/category-menu.css?v=60">
<link rel="stylesheet" href="../shared/page-shell.css?v=20">
<link rel="stylesheet" href="monthly.css?v=19">
<link rel="stylesheet" href="../shared/month-selector.css?v=8">
<link rel="stylesheet" href="../shared/race-button-style.css?v=7">
<script src="../shared/sport-preferences.js?v=2"></script>
<script src="../shared/category-menu.js?v=56" defer></script>
<script src="../shared/fixed-layout.js?v=22" defer></script>
<script src="../shared/bottom-nav.js?v=64" defer></script>
<script src="../shared/month-selector.js?v=3" defer></script>
<script src="monthly.js?v=14" defer></script>
</head>
<body>
<zenrace-category-menu category="schedule" active="monthly"></zenrace-category-menu>
<div class="month-toolbar" data-zenrace-month-selector aria-label="月選択">
  <div class="month-toolbar-side left"></div>
  <div class="month-nav">
    <button class="month-arrow" data-month-prev aria-label="前月">‹</button>
    <div class="month-title" data-month-title></div>
    <button class="month-arrow" data-month-next aria-label="翌月">›</button>
  </div>
  <div class="month-toolbar-side right"><button class="current-month-btn" data-month-current>当月</button></div>
</div>
<div class="zenrace-content-shell" data-zenrace-pinch-shell>
  <div class="zenrace-content-sizer" data-zenrace-pinch-sizer>
    <div class="zenrace-content-stage" data-zenrace-pinch-stage>
      <main class="monthly-page">
        <section class="monthly-schedule" id="monthlySchedule" aria-live="polite"></section>
      </main>
    </div>
  </div>
</div>
<zenrace-bottom-nav active="schedule"></zenrace-bottom-nav>
</body>
</html>
