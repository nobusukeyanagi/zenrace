<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover">
<meta name="theme-color" content="#090909">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<link rel="apple-touch-icon" sizes="180x180" href="/zenrace/apple-touch-icon.png?v=3">
<link rel="icon" type="image/png" sizes="32x32" href="/zenrace/favicon-32x32.png?v=3">
<link rel="icon" type="image/png" sizes="16x16" href="/zenrace/favicon-16x16.png?v=3">
<link rel="shortcut icon" type="image/x-icon" href="/zenrace/favicon.ico?v=3">
<title>設定 | ZENRACE</title>
<link rel="stylesheet" href="../shared/category-menu.css?v=60">
<link rel="stylesheet" href="../shared/page-shell.css?v=19">
<link rel="stylesheet" href="settings.css?v=3">
<script src="../shared/sport-preferences.js?v=2"></script>
<script src="../shared/category-menu.js?v=39" defer></script>
<script src="../shared/fixed-layout.js?v=21" defer></script>
<script src="../shared/bottom-nav.js?v=64" defer></script>
<script src="settings.js?v=2" defer></script>
</head>
<body>
<zenrace-category-menu category="home" active="settings"></zenrace-category-menu>
<div class="zenrace-content-shell" data-zenrace-pinch-shell>
  <div class="zenrace-content-sizer" data-zenrace-pinch-sizer>
    <div class="zenrace-content-stage" data-zenrace-pinch-stage>
      <main class="settings-main">
        <section class="settings-section" aria-labelledby="sport-settings-title">
          <div class="settings-section-header">
            <h1 class="settings-title" id="sport-settings-title">表示する競技</h1>
            <p class="settings-description">スケジュールと投票ページに表示する競技を選択します。右端を上下にスライドすると表示順を変更できます。</p>
          </div>
          <fieldset class="sport-setting-list" data-sport-setting-list>
            <legend class="visually-hidden">表示する競技と表示順</legend>
            <div class="sport-setting-option" data-sport-row data-sport-id="keirin">
              <label class="sport-setting-control">
                <input type="checkbox" value="keirin" data-sport-preference checked>
                <span class="sport-checkbox" aria-hidden="true"></span>
                <span class="sport-setting-icon keirin" aria-hidden="true"></span>
                <span class="sport-setting-name">競輪</span>
              </label>
              <button class="sport-drag-handle" type="button" data-sport-drag-handle aria-label="競輪の表示順を変更"><span aria-hidden="true"></span></button>
            </div>
            <div class="sport-setting-option" data-sport-row data-sport-id="auto">
              <label class="sport-setting-control">
                <input type="checkbox" value="auto" data-sport-preference checked>
                <span class="sport-checkbox" aria-hidden="true"></span>
                <span class="sport-setting-icon auto" aria-hidden="true"></span>
                <span class="sport-setting-name">オートレース</span>
              </label>
              <button class="sport-drag-handle" type="button" data-sport-drag-handle aria-label="オートレースの表示順を変更"><span aria-hidden="true"></span></button>
            </div>
            <div class="sport-setting-option" data-sport-row data-sport-id="boat">
              <label class="sport-setting-control">
                <input type="checkbox" value="boat" data-sport-preference checked>
                <span class="sport-checkbox" aria-hidden="true"></span>
                <span class="sport-setting-icon boat" aria-hidden="true"></span>
                <span class="sport-setting-name">ボートレース</span>
              </label>
              <button class="sport-drag-handle" type="button" data-sport-drag-handle aria-label="ボートレースの表示順を変更"><span aria-hidden="true"></span></button>
            </div>
            <div class="sport-setting-option" data-sport-row data-sport-id="nar">
              <label class="sport-setting-control">
                <input type="checkbox" value="nar" data-sport-preference checked>
                <span class="sport-checkbox" aria-hidden="true"></span>
                <span class="sport-setting-icon nar" aria-hidden="true"></span>
                <span class="sport-setting-name">地方競馬</span>
              </label>
              <button class="sport-drag-handle" type="button" data-sport-drag-handle aria-label="地方競馬の表示順を変更"><span aria-hidden="true"></span></button>
            </div>
            <div class="sport-setting-option" data-sport-row data-sport-id="jra">
              <label class="sport-setting-control">
                <input type="checkbox" value="jra" data-sport-preference checked>
                <span class="sport-checkbox" aria-hidden="true"></span>
                <span class="sport-setting-icon jra" aria-hidden="true"></span>
                <span class="sport-setting-name">JRA</span>
              </label>
              <button class="sport-drag-handle" type="button" data-sport-drag-handle aria-label="JRAの表示順を変更"><span aria-hidden="true"></span></button>
            </div>
          </fieldset>
          <div class="visually-hidden" role="status" aria-live="polite" data-sport-order-status></div>
        </section>
      </main>
    </div>
  </div>
</div>
<zenrace-bottom-nav active="home"></zenrace-bottom-nav>
</body>
</html>
