name: Graded-race Update

on:
  schedule:
    # 日本時間の毎日25:00（暦上は翌日01:00）。UTCでは前日16:00。
    - cron: '0 16 * * *'
  workflow_dispatch:
    inputs:
      base_date:
        description: '基準日 YYYY-MM-DD（空欄なら日本時間の当日）'
        required: false
        type: string

concurrency:
  group: graded-race-update
  cancel-in-progress: false

jobs:
  update:
    name: Daily integrated update
    runs-on: ubuntu-latest
    permissions:
      contents: write
    outputs:
      website_changed: ${{ steps.commit.outputs.website_changed }}
    timeout-minutes: 60

    steps:
      - name: Checkout latest main
        uses: actions/checkout@v6
        with:
          ref: main
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: gradedraces/requirements.txt

      - name: Install dependencies
        run: python -m pip install -r gradedraces/requirements.txt

      - name: Run integrated graded-race update
        working-directory: gradedraces
        env:
          BASE_DATE: ${{ inputs.base_date }}
        run: |
          if [ -n "$BASE_DATE" ]; then
            python -m scripts.daily_update \
              --date "$BASE_DATE" \
              --fail-if-all-sources-fail
          else
            python -m scripts.daily_update \
              --fail-if-all-sources-fail
          fi

      - name: Run official venue schedule update
        env:
          BASE_DATE: ${{ inputs.base_date }}
        run: |
          if [ -n "$BASE_DATE" ]; then
            python -m monthly.scripts.update_schedule \
              --date "$BASE_DATE" \
              --smart \
              --fail-if-all-sources-fail
          else
            python -m monthly.scripts.update_schedule \
              --smart \
              --fail-if-all-sources-fail
          fi

      - name: Run schedule and notification tests
        run: python -m unittest discover -s monthly/tests -p 'test_*.py'

      - name: Write update quality summary
        if: always()
        working-directory: gradedraces
        run: |
          python - <<'PY'
          import json
          import os
          from pathlib import Path

          def load(name):
              path = Path(name)
              return json.loads(path.read_text(encoding='utf-8')) if path.exists() else {}

          daily = load('daily_update_report.json')
          master = load('master_schedule_report.json')
          incomplete = load('incomplete_records.json')
          detail_status = load('source_status.json')
          monthly = json.loads(Path('../monthly/monthly_update_report.json').read_text(encoding='utf-8')) if Path('../monthly/monthly_update_report.json').exists() else {}
          summary = daily.get('summary', {})
          lines = [
              '# Graded-race Update',
              '',
              '## Integrated result',
              f"- 公式日程取得: {summary.get('master_official_records', 0)}件",
              f"- 新規レース追加（～{summary.get('master_new_addition_end', '')}）: {summary.get('master_added', 0)}件",
              f"- 翌月末より先の追加保留: {summary.get('master_deferred_additions', 0)}件",
              f"- 基本情報更新: {summary.get('master_updated', 0)}件",
              f"- 公式日程との照合要確認: {summary.get('master_review_required', 0)}件",
              f"- 重複候補: {summary.get('master_duplicates', 0)}件",
              f"- 個別ページ確認対象: {summary.get('detail_targets', 0)}件",
              f"- 発走時刻・優勝者等の更新: {summary.get('detail_changes', 0)}件",
              f"- 終了済み未解決: {incomplete.get('past_unresolved_count', 0)}件",
              f"- 開催前の時刻未公開: {incomplete.get('upcoming_missing_time_count', 0)}件",
              f"- 開催日程（基準日 {monthly.get('target_date', '')}）: {monthly.get('before_count', 0)}件 → {monthly.get('after_count', 0)}件",
              f"- 通常更新範囲: {monthly.get('refresh_window', {}).get('start', '')} ～ {monthly.get('refresh_window', {}).get('end', '')}",
              f"- 過去90日の未解決再確認: {monthly.get('retried_unresolved_count', 0)}件",
              f"- 翌月末までの新規開催追加: {monthly.get('new_addition_count', 0)}件",
              f"- 未解決残数: {monthly.get('unresolved_after_count', 0)}件",
              '',
              '## Official schedules',
          ]
          for source in master.get('sources', []):
              state = 'OK' if source.get('ok') else 'FAILED'
              lines.append(
                  f"- {source.get('name', '')}: {state}, "
                  f"records={source.get('record_count', 0)}, warnings={len(source.get('warnings', []))}"
              )
          lines.append('')
          lines.append('## Detail sources')
          for source in detail_status.get('sources', []):
              state = 'OK' if source.get('ok') else 'FAILED'
              lines.append(
                  f"- {source.get('name', '')}: {state}, "
                  f"patches={source.get('patch_count', 0)}, warnings={len(source.get('warnings', []))}"
              )
          lines.append('')
          lines.append('## Venue schedule sources')
          for source in monthly.get('sources', []):
              state = 'OK' if source.get('ok') else 'FAILED'
              lines.append(
                  f"- {source.get('sport', '')}: {state}, "
                  f"entries={source.get('entry_count', 0)}, warnings={len(source.get('warnings', []))}"
              )
          with open(os.environ['GITHUB_STEP_SUMMARY'], 'a', encoding='utf-8') as output:
              output.write('\n'.join(lines) + '\n')
          PY

      - name: Commit updated website data
        id: commit
        run: |
          git config user.name 'graded-races-bot'
          git config user.email 'graded-races-bot@users.noreply.github.com'

          DATA_CHANGED=0
          if ! git diff --quiet -- \
            gradedraces/races.json \
            gradedraces/graded_races_schedule.html \
            gradedraces/index.html \
            monthly/monthly.js; then
            DATA_CHANGED=1
          fi

          # 更新処理が生成・更新するファイルをすべてステージする。
          # レポート類を残したまま rebase すると、未ステージ変更として拒否されるため、
          # Web公開対象に変更がない場合も実行状態・レポートは同じコミットへ含める。
          for file in \
            gradedraces/races.json \
            gradedraces/graded_races_schedule.html \
            gradedraces/index.html \
            gradedraces/schedule_sync_state.json \
            gradedraces/changes.json \
            gradedraces/source_status.json \
            gradedraces/incomplete_records.json \
            gradedraces/master_schedule_report.json \
            gradedraces/daily_update_report.json \
            monthly/monthly.js \
            monthly/monthly_update_report.json \
            monthly/schedule_sync_state.json; do
            [ -f "$file" ] && git add "$file"
          done

          # Web公開対象ファイルに変更があったかを、後続のデプロイjobへ渡す。
          echo "website_changed=$DATA_CHANGED" >> "$GITHUB_OUTPUT"

          if git diff --cached --quiet; then
            echo '公営競技情報の変更はありません。'
          else
            git commit -m 'Update public racing schedules (daily integrated)'

            # rebase前に作業ツリーが空であることを保証する。
            # 新しい生成ファイルが増えた場合は、黙って破棄せずファイル名を表示して停止する。
            if [ -n "$(git status --porcelain)" ]; then
              echo '::error::コミット対象に含まれていない生成ファイルまたは変更が残っています。'
              git status --short
              exit 1
            fi

            git fetch origin main
            git rebase origin/main
            git push origin HEAD:main
          fi

      - name: Upload update reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: graded-race-update-report
          path: |
            gradedraces/daily_update_report.json
            gradedraces/master_schedule_report.json
            gradedraces/changes.json
            gradedraces/source_status.json
            gradedraces/incomplete_records.json
            gradedraces/schedule_sync_state.json
            monthly/monthly_update_report.json
            monthly/schedule_sync_state.json
          if-no-files-found: ignore
          retention-days: 30


  deploy:
    name: Deploy updated website
    needs: update
    if: needs.update.outputs.website_changed == '1'
    permissions:
      contents: read
      pages: write
      id-token: write
    uses: ./.github/workflows/deploy-website.yml
